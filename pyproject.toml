[project]
name = "kinyalm"
version = "0.1.0"
description = "Kinyarwanda language-modeling and tutor MVP project"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "datasets>=3.0.0",
  "huggingface_hub>=0.33.0",
  "matplotlib>=3.9.0",
  "numpy>=2.0.0",
  "pandas>=2.2.0",
  "pytest>=8.0.0",
  "pyyaml>=6.0.0",
  "rich>=13.0.0",
  "torch>=2.5.0",
  "tqdm>=4.66.0",
  "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6.0",
]
train = [
  "accelerate>=1.0.0,<2",
  "bitsandbytes>=0.45.0,<1; platform_system == 'Linux'",
  "peft>=0.14.0,<1",
  # Gemma 4 Unified support landed in the Transformers 5 generation. The exact
  # lower bound below is the version used by the checked-in lock and local
  # metadata preflight.
  "transformers>=5.14.1,<6",
  # TRL 1.3 added Gemma 4 support. Keep the major version bounded because this
  # package owns the training loop and its API changes affect every profile.
  "trl>=1.3.0,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kinyalm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
exclude = ["coursework/cs336"]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
